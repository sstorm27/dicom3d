[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom3d"
version = "0.1.0"
description = "Aplicatie desktop offline pentru reconstructie 3D din serii DICOM"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pydicom>=2.4",
    "SimpleITK>=2.3",
    "vtk>=9.3",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6"]

[project.scripts]
dicom3d-cli = "dicom3d.cli:main"

[project.gui-scripts]
dicom3d = "dicom3d.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dicom3d.ui" = ["assets/fonts/*.ttf", "assets/fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
